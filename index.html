<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Department of Mechanical &amp; Aerospace Engineering | Western Michigan University</title>
  
  <!-- Preconnect & Google Fonts: Montserrat & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
  
  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/typography.css?v=20260916v11">
  <link rel="stylesheet" href="css/animations.css?v=20260916v11">
  <link rel="stylesheet" href="css/style.css?v=20260916v11">
</head>
<body>
  <!-- Ambient Graphic Canvas Layer -->
  <div class="ambient-grid"></div>
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <!-- Kiosk Root Display -->
  <div class="kiosk-root">
    
    <!-- Top HUD Header -->
    <header class="hud-header">
      <div class="hud-left">
        <img src="images/wmu-logo-official-dark.svg" alt="Western Michigan University" class="wmu-logo-img">
        <div class="hud-divider"></div>
        <div class="hud-dept-info">
          <span class="hud-college-label">College of Engineering &amp; Applied Sciences</span>
          <span class="hud-dept-title">Mechanical &amp; Aerospace Engineering</span>
        </div>
      </div>

      <div class="hud-right">
        <!-- Live Kalamazoo Weather Widget -->
        <div class="weather-badge" id="weatherWidget" title="Live Weather at Parkview Campus">
          <span class="weather-icon" id="weatherIcon">🌤️</span>
          <div class="weather-text">
            <span class="weather-temp" id="weatherTemp">--°F</span>
            <span class="weather-desc" id="weatherDesc">Kalamazoo, MI</span>
          </div>
        </div>

        <!-- Kiosk Status Pill -->
        <div class="kiosk-status-pill" title="Press SPACE to pause/resume, F for fullscreen">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">LIVE</span>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Slides Viewport -->
    <main class="slides-viewport" id="slidesViewport">
      <!-- Dynamically populated by js/slideshow.js from data/slides.json -->
    </main>

    <!-- Bottom HUD Footer -->
    <footer class="hud-footer">
      <div class="footer-left">
        <span class="text-gold font-bold" style="letter-spacing: 1px;">PARKVIEW CAMPUS</span>
        <span>• Elson S. Floyd Hall • Room F-234</span>
      </div>

      <!-- Golden Progress Bar & Slide Counter -->
      <div class="progress-container">
        <div class="progress-meta">
          <span>DISPLAY CYCLE</span>
          <span id="progressCounter">SLIDE 1 OF 10</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
      </div>

      <!-- Live Clock -->
      <div class="footer-right">
        <span class="footer-clock-time" id="clockTime">--:--:-- --</span>
        <span>•</span>
        <span class="footer-clock-date" id="clockDate">--------</span>
      </div>
    </footer>

  </div>

  <!-- Client-side Logic & Data -->
  <script src="data/fallback.js?v=20260916v11"></script>
  <script src="js/weather.js?v=20260916v11"></script>
  <script src="js/slideshow.js?v=20260916v11"></script>
  <script src="js/controls.js?v=20260916v11"></script>
  <script src="js/app.js?v=20260916v11"></script>
</body>
</html>
