name: News collector freshness
on:
  schedule:
    - cron: '47 3,9,15,21 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r scripts/news-scraper/requirements.txt
      - run: python scripts/news-scraper/health.py
