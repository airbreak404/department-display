name: MAE News Scraper
on:
  schedule:
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect candidates without committing or deploying
        type: boolean
        default: true
      classifier_check:
        description: Test Gemini against two official articles only; never publish
        type: boolean
        default: false
permissions: {}
concurrency:
  group: mae-news-writer
  cancel-in-progress: false
jobs:
  scrape:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/news-scraper/requirements.txt
      - run: pip install --require-hashes -r scripts/news-scraper/requirements.txt
      - name: Collect and classify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          DRY_RUN: ${{ inputs.dry_run }}
          CLASSIFIER_CHECK: ${{ inputs.classifier_check }}
        run: |
          if [ "$CLASSIFIER_CHECK" = "true" ]; then
            python scripts/news-scraper/check_classifier.py
          elif [ "$DRY_RUN" = "true" ]; then
            python scripts/news-scraper/main.py --dry-run
          else
            python scripts/news-scraper/main.py
          fi
      - if: inputs.dry_run != true && inputs.classifier_check != true
        run: python scripts/news-scraper/publish.py prepare
      - if: inputs.dry_run != true && inputs.classifier_check != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-news
          path: scratch/publish/
          retention-days: 1
      - name: Summary
        if: always()
        run: |
          if [ -f scratch/news/report.json ]; then
            echo '### MAE news collection report' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat scratch/news/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: news-diagnostics
          path: scratch/news/
          retention-days: 30
  validate:
    needs: scrape
    if: inputs.dry_run != true && inputs.classifier_check != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.scrape.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/news-scraper/requirements-test.txt
      - run: pip install --require-hashes -r scripts/news-scraper/requirements-test.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: approved-news
          path: scratch/download
      - run: python scripts/news-scraper/publish.py apply
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m playwright install --with-deps chromium
      - name: Decode every candidate feed QR before publication
        run: python tests/browser_news.py
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: news-qr-failure-evidence
          path: test-results/
          retention-days: 30
  publish:
    needs: [scrape, validate]
    if: inputs.dry_run != true && inputs.classifier_check != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
      news_changed: ${{ steps.commit.outputs.news_changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
      - name: Require unchanged source revision
        env:
          SOURCE_SHA: ${{ needs.scrape.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r scripts/news-scraper/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: approved-news
          path: scratch/download
      - run: python scripts/news-scraper/publish.py apply
      - name: Commit only validated news outputs
        id: commit
        run: |
          git config user.name mae-news-bot
          git config user.email mae-news-bot@users.noreply.github.com
          news_changed=false
          if ! git diff --quiet -- data/news.json; then news_changed=true; fi
          echo "news_changed=$news_changed" >> "$GITHUB_OUTPUT"
          git add -- data/news.json data/news-health.json scripts/news-scraper/state.json
          if ! git diff --cached --quiet; then
            test -z "$(git diff --cached --name-only | grep -vE '^(data/news(-health)?.json|scripts/news-scraper/state.json)$')"
            git commit -m 'chore: update validated MAE news'
            git push origin HEAD:master
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: publish
    if: needs.publish.outputs.news_changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-reusable.yml
    with:
      revision: ${{ needs.publish.outputs.revision }}
